<!DOCTYPE html>
<html>
<head>
    <title>Live Poll</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            text-align: center; 
            padding: 30px 20px; 
            background: #ffffff; 
            color: #000000;
        }
        h2 { 
            font-weight: 700; 
            margin-bottom: 40px; 
            font-size: 24px;
        }
        .btn { 
            display: block; 
            width: 100%; 
            max-width: 350px; 
            margin: 15px auto; 
            padding: 18px; 
            font-size: 16px; 
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            color: #ffffff; 
            background: #0B1340; /* AFP Navy Blue */
            border: 2px solid #0B1340; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .btn:active { 
            background: #F7C822; /* AFP Sunburst Gold */
            color: #0B1340; 
            border-color: #F7C822; 
        }
        #thanks { 
            display: none; 
            margin-top: 40px; 
            font-size: 22px; 
            font-weight: 700; 
            color: #0B1340; 
        }
    </style>
</head>
<body>
    <h2>{{ poll_data.question }}</h2>
    
    {% for option in poll_data.options.keys() %}
        <button class="btn" onclick="sendVote('{{ option }}')">{{ option }}</button>
    {% endfor %}

    <p id="thanks">Vote recorded!<br><span style="font-size: 16px; font-weight: 400;">Look at the screen.</span></p>

    <script>
        const socket = io();
        const currentPollId = "{{ poll_id }}";

        function sendVote(choice) {
            socket.emit('submit_vote', { poll_id: currentPollId, choice: choice });
            document.querySelectorAll('.btn').forEach(b => b.style.display = 'none');
            document.getElementById('thanks').style.display = 'block';
        }
    </script>
</body>
</html>
