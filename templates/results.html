<!DOCTYPE html>
<html>
<head>
    <title>Live Results</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background: #ffffff; 
            color: #000000;
        }
        h1 { 
            font-weight: 700; 
            margin-bottom: 30px; 
            text-align: center; 
            font-size: 42px;
        }
        .chart-container { 
            width: 85%; 
            max-width: 1000px; 
        }
    </style>
</head>
<body>
    <h1>{{ poll_data.question }}</h1>
    <div class="chart-container">
        <canvas id="pollChart"></canvas>
    </div>

    <script>
        const socket = io();
        const currentPollId = "{{ poll_id }}";
        const ctx = document.getElementById('pollChart').getContext('2d');
        
        // Set global Chart.js font
        Chart.defaults.font.family = "'Montserrat', sans-serif";
        Chart.defaults.font.size = 18;
        Chart.defaults.color = '#000000';

        const initialLabels = {{ poll_data.options.keys() | list | tojson }};
        const initialData = {{ poll_data.options.values() | list | tojson }};

        let pollChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: initialLabels,
                datasets: [{
                    label: 'Live Votes',
                    data: initialData,
                    backgroundColor: '#0B1340', /* AFP Navy Blue */
                    borderRadius: 6
                }]
            },
            options: {
                scales: { 
                    y: { 
                        beginAtZero: true, 
                        ticks: { stepSize: 1 } 
                    },
                    x: {
                        ticks: { font: { weight: '600' } }
                    }
                },
                animation: { duration: 500 },
                plugins: { legend: { display: false } }
            }
        });

        socket.on('update_chart', function(data) {
            if (data.poll_id === currentPollId) {
                pollChart.data.labels = Object.keys(data.data);
                pollChart.data.datasets[0].data = Object.values(data.data);
                pollChart.update();
            }
        });
    </script>
</body>
</html>
